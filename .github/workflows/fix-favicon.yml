name: Fix live favicon

on:
  push:
    paths:
      - '.github/workflows/fix-favicon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point site to new favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('my-portfolio/index.html')
          s = p.read_text()
          old = '  <link rel="icon" type="image/png" href="favicon-victorino.png" />'
          new = '''  <link rel="icon" type="image/png" sizes="64x64" href="favicon-victorino-v2.png?v=2" />\n  <link rel="shortcut icon" type="image/png" href="favicon-victorino-v2.png?v=2" />'''
          if old not in s:
              raise SystemExit('Current favicon line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit favicon fix
        run: |
          git config user.name "victorinoai"
          git config user.email "victorino.rhv@gmail.com"
          git add my-portfolio/index.html
          git commit -m "Fix live site favicon path"
          git push origin main
