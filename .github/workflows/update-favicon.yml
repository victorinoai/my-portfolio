name: Update favicon reference

on:
  push:
    paths:
      - '.github/workflows/update-favicon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update favicon link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('my-portfolio/index.html')
          s = p.read_text()
          old = '''  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />'''
          new = '''  <link rel="icon" type="image/png" href="favicon-victorino.png" />'''
          if old not in s:
              raise SystemExit('Old favicon link not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit favicon update
        run: |
          git config user.name "victorinoai"
          git config user.email "victorino.rhv@gmail.com"
          git add my-portfolio/index.html
          git commit -m "Use Victorino emblem as site favicon"
          git push origin main
