name: Embed Victorino favicon

on:
  push:
    paths:
      - '.github/workflows/force-favicon-refresh.yml'

permissions:
  contents: write

jobs:
  update-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Embed Victorino V favicon into HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          html_path = Path('my-portfolio/index.html')
          icon_path = Path('my-portfolio/favicon-victorino-v2.png')

          text = html_path.read_text(encoding='utf-8')
          data_uri = 'data:image/png;base64,' + base64.b64encode(icon_path.read_bytes()).decode('ascii')

          pattern = re.compile(
              r'\s*<link rel="icon" id="site-favicon"[^>]*>\s*<script>.*?</script>\s*',
              re.DOTALL,
          )
          replacement = '\n  <link rel="icon" type="image/png" sizes="64x64" href="' + data_uri + '" />\n'

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one existing favicon block, found {count}.')

          html_path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit embedded favicon
        run: |
          git config user.name "victorinoai"
          git config user.email "victorino.rhv@gmail.com"
          git add my-portfolio/index.html
          git commit -m "Embed Victorino V favicon directly"
          git push origin main
