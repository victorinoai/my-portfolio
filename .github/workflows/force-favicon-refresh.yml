name: Set favicon-optimized Victorino icon

on:
  push:
    paths:
      - '.github/workflows/force-favicon-refresh.yml'

permissions:
  contents: write

jobs:
  update-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point HTML to favicon-optimized V icon
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('my-portfolio/index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'\s*<link rel="icon" type="image/png" sizes="64x64" href="data:image/png;base64,[^"]+" />\s*')
          replacement = '''\n  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v3.png?rev=3" />\n  <link rel="shortcut icon" type="image/png" href="/favicon-v3.png?rev=3" />\n'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one embedded favicon tag, found {count}.')

          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit favicon reference
        run: |
          git config user.name "victorinoai"
          git config user.email "victorino.rhv@gmail.com"
          git add my-portfolio/index.html
          git commit -m "Use favicon-optimized Victorino V icon"
          git push origin main
