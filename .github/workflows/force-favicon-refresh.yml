name: Force favicon refresh

on:
  push:
    paths:
      - '.github/workflows/force-favicon-refresh.yml'

permissions:
  contents: write

jobs:
  update-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force Victorino favicon refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('my-portfolio/index.html')
          text = path.read_text(encoding='utf-8')
          old = '''  <link rel="icon" type="image/png" sizes="64x64" href="favicon-victorino-v2.png?v=2" />\n  <link rel="shortcut icon" type="image/png" href="favicon-victorino-v2.png?v=2" />'''
          new = '''  <link rel="icon" id="site-favicon" type="image/png" sizes="64x64" href="/favicon-victorino-v2.png?rev=20261009-1446" />\n  <script>\n    (() => {\n      const href = '/favicon-victorino-v2.png?rev=' + Date.now();\n      document.querySelectorAll('link[rel~="icon"], link[rel="shortcut icon"]').forEach((node) => node.remove());\n      const icon = document.createElement('link');\n      icon.rel = 'icon';\n      icon.type = 'image/png';\n      icon.sizes = '64x64';\n      icon.href = href;\n      document.head.appendChild(icon);\n    })();\n  </script>'''
          if old not in text:
              raise SystemExit('Expected favicon markup not found; aborting without changes.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit favicon fix
        run: |
          git config user.name "victorinoai"
          git config user.email "victorino.rhv@gmail.com"
          git add my-portfolio/index.html
          git commit -m "Force browser to refresh Victorino favicon"
          git push origin main
