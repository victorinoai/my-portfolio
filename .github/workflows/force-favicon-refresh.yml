name: Set Victorino SVG favicon

on:
  push:
    paths:
      - '.github/workflows/force-favicon-refresh.yml'

permissions:
  contents: write

jobs:
  update-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point HTML to optimized Victorino SVG favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('my-portfolio/index.html')
          text = path.read_text(encoding='utf-8')

          patterns = [
              re.compile(r'\s*<link rel="icon" type="image/png" sizes="32x32" href="/favicon-v3\.png\?rev=3" />\s*<link rel="shortcut icon" type="image/png" href="/favicon-v3\.png\?rev=3" />\s*'),
              re.compile(r'\s*<link rel="icon" type="image/png" sizes="64x64" href="data:image/png;base64,[^"]+" />\s*'),
          ]
          replacement = '''\n  <link rel="icon" type="image/svg+xml" href="/favicon-v.svg?rev=4" />\n  <link rel="shortcut icon" type="image/svg+xml" href="/favicon-v.svg?rev=4" />\n'''

          updated = text
          count = 0
          for pattern in patterns:
              updated, n = pattern.subn(replacement, updated, count=1)
              if n:
                  count += n
                  break

          if count != 1:
              raise SystemExit(f'Expected one current favicon block, found {count}.')

          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit SVG favicon reference
        run: |
          git config user.name "victorinoai"
          git config user.email "victorino.rhv@gmail.com"
          git add my-portfolio/index.html
          git commit -m "Use Victorino SVG favicon"
          git push origin main
