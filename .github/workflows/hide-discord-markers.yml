name: Hide Discord Internal Markers

on:
  push:
    paths:
      - '.github/workflows/hide-discord-markers.yml'

permissions:
  contents: write

jobs:
  patch-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: victorino-discord-bot

      - name: Remove visible internal markers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('victorino-discord-bot/src/index-v2.js')
          text = path.read_text(encoding='utf-8')

          old = """  const existing = messages?.find(\n    message => message.author.id === client.user.id && message.embeds.some(embed => embed.footer?.text === marker),\n  );"""
          new = """  const existing = messages?.find(\n    message => message.author.id === client.user.id && (\n      message.embeds.some(embed => embed.footer?.text === marker) ||\n      message.embeds.length > 0\n    ),\n  );"""
          if old not in text:
              raise SystemExit('Could not find upsert marker lookup block')
          text = text.replace(old, new, 1)

          old = """function infoEmbed(title, description, marker) {\n  return new EmbedBuilder()\n    .setTitle(title)\n    .setDescription(description)\n    .setFooter({ text: marker });\n}"""
          new = """function infoEmbed(title, description) {\n  return new EmbedBuilder()\n    .setTitle(title)\n    .setDescription(description);\n}"""
          if old not in text:
              raise SystemExit('Could not find infoEmbed footer block')
          text = text.replace(old, new, 1)

          footer = "\n    .setFooter({ text: 'VICTORINO_PROJECT_KICKOFF' });"
          if footer not in text:
              raise SystemExit('Could not find project kickoff footer')
          text = text.replace(footer, ';', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit clean embeds
        run: |
          git config user.name "victorinoai"
          git config user.email "victorino.rhv@gmail.com"
          git add victorino-discord-bot/src/index-v2.js
          git commit -m "Hide Discord internal embed markers"
          git push origin victorino-discord-bot
